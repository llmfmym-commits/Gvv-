name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project zip (if present)
        run: |
          if [ -f erd-base-18.zip ]; then
            echo "Found erd-base-18.zip, extracting..."
            unzip -o erd-base-18.zip -d .

            # اگر settings.gradle.kts در ریشه نیست، شاید داخل یک پوشه‌ی
            # اضافه‌ی تک‌فرزندی باشد (مثلاً erd-base-18/settings.gradle.kts)
            if [ ! -f settings.gradle.kts ]; then
              INNER_DIR=$(find . -maxdepth 1 -type d ! -name '.' ! -name '.git' ! -name '.github' | head -n 1)
              if [ -n "$INNER_DIR" ] && [ -f "$INNER_DIR/settings.gradle.kts" ]; then
                echo "Found nested project folder: $INNER_DIR — moving contents to root"
                shopt -s dotglob
                mv "$INNER_DIR"/* .
                rmdir "$INNER_DIR"
              fi
            fi
          else
            echo "erd-base-18.zip NOT found in repo root!"
          fi

      - name: List root directory (debug)
        run: ls -la

      - name: Verify settings.gradle.kts exists
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts still not found in root after extraction!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erd-base-debug-apk
          path: app/build/outputs/apk/debug/*.apk
